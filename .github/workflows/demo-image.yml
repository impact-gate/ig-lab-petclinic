name: Demo image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build jar
        run: ./mvnw -B -DskipTests -Dsonar.skip=true package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          docker build -f Dockerfile.demo -t ghcr.io/impact-gate/ig-lab-petclinic:demo .
          docker push ghcr.io/impact-gate/ig-lab-petclinic:demo
